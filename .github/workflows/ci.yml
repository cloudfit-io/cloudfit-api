name: CI

# Lint, type-check, and test every pull request (including the weekly
# snapshot-refresh PRs) and every push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# Least privilege by default; jobs that need more (publish, release) declare it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check cloudfit_api/

      - name: Type check with mypy
        run: mypy --strict cloudfit_api/

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=cloudfit_api --cov-report=term --cov-fail-under=95

  # Known vulnerabilities in what users install: the package's runtime
  # dependencies, resolved in isolation (not the test tooling in the job above).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit .

  # Build the container the way it ships and smoke-test it: health, a real
  # recommendation (with the cpu_arch floor), and a 422 for an invalid body.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t cloudfit-api:ci .

      - name: Smoke test
        run: |
          docker run -d --name api -e PORT=8000 -p 8000:8000 cloudfit-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/recommend -H 'content-type: application/json' \
            -d '{"vcpu":16,"ram_gb":64,"cpu_arch":"x86_64"}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['results'], d; print('top pick:', d['results'][0]['instance']['id'])"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/recommend -H 'content-type: application/json' -d '{}')" = 422
          test "$(docker exec api whoami)" = appuser

      - name: Container logs
        if: always()
        run: docker logs api || true

